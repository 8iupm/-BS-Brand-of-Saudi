<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BS | BRAND OF SAUDI</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;color:#252525;background:#faf9f7}button,input,select{font:inherit}button{cursor:pointer}header{background:white;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:12px 5%;gap:8px}.logo{font-size:26px;font-weight:900}.logo b{color:#b56e49}.icon{background:#f2eee9;border:0;border-radius:10px;padding:12px;min-height:45px}.hero{padding:55px 7%;background:linear-gradient(120deg,#ead4c0,#f7eee4);display:flex;align-items:center;justify-content:space-between;gap:10px}.hero h1{font-size:clamp(27px,5vw,52px);margin:0}.hero p{line-height:2}.hero .art{font-size:95px}.primary{background:#252525;color:white;border:0;border-radius:9px;padding:12px 18px;min-height:44px}main{max-width:1150px;margin:auto;padding:24px 5%}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:15px 0 40px}.card{background:white;border:1px solid #eee;border-radius:14px;overflow:hidden}.photo{background:linear-gradient(135deg,#eee2d5,#e7e9e9);height:175px;display:grid;place-items:center;font-size:75px}.details{padding:13px}.details small{color:#986344}.details h3{font-size:15px;min-height:42px}.details strong{display:block;margin-bottom:10px}.details button{width:100%}.chip{border:1px solid #ddd;background:white;border-radius:30px;padding:10px 14px;margin:4px}.chip.on{background:#252525;color:white}.panel{position:fixed;right:0;top:0;height:100%;width:min(360px,90vw);background:white;z-index:20;transform:translateX(105%);transition:transform .2s;overflow:auto;padding:20px;box-shadow:0 0 30px #0002}.panel.open{transform:translateX(0)}.shade{position:fixed;inset:0;background:#0007;z-index:15;display:none}.shade.open{display:block}.navhead{display:flex;justify-content:space-between;align-items:center}.group{width:100%;padding:16px;text-align:right;background:white;border:0;border-bottom:1px solid #eee;font-weight:bold}.sub{display:none;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0}.sub.open{display:grid}.sub button{border:0;background:#f5f1ec;border-radius:8px;padding:13px 5px}.cartline{border-bottom:1px solid #eee;padding:13px 0}.cartline button{border:0;background:#f3e8df;padding:6px 10px;border-radius:7px}.muted{color:#777}footer{text-align:center;background:#252525;color:white;padding:25px}.toast{position:fixed;bottom:18px;left:18px;background:#252525;color:white;padding:12px;border-radius:8px;display:none;z-index:30}#search{width:min(320px,100%);padding:12px;border:1px solid #ddd;border-radius:9px}select{padding:10px;border:1px solid #ddd;border-radius:8px;width:100%;margin:8px 0}#detail{max-width:450px;margin:10px auto;background:white;padding:22px;border-radius:15px}#detail .photo{height:200px}#detail h2{margin-bottom:8px}@media(max-width:750px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:130px;font-size:58px}.hero{padding:30px 6%}.hero .art{font-size:60px}.details{padding:10px}.details h3{font-size:13px}.logo{font-size:22px}}@media(max-width:350px){.hero .art{display:none}.photo{height:105px;font-size:48px}}

:root{--green:#07543a;--deep:#002f22;--mint:#e8f5ed;--line:#d7e8de}
body{background:#f7fbf8;color:#12362a}header{border-bottom:1px solid var(--line);box-shadow:0 3px 15px #003b2010}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--deep);direction:ltr}.brand img{width:49px;height:49px;border-radius:10px;object-fit:cover}.brand span{display:flex;flex-direction:column;line-height:1.1}.brand strong{font-size:26px;letter-spacing:2px}.brand small{font-size:9px;letter-spacing:1.3px;color:#27845c;margin-top:5px}
.icon{background:var(--mint);color:var(--deep)}.icon:hover,.chip:hover{background:#d5eddf}
.hero{background:linear-gradient(115deg,#e8f7ed,#ffffff 55%,#c9e7d5);border-bottom:1px solid var(--line);gap:30px}.hero h1{color:var(--deep);letter-spacing:1px}.hero p{color:#3b6451}.hero-brand img{width:min(230px,32vw);aspect-ratio:1;object-fit:cover;border-radius:24px;box-shadow:0 18px 35px #002f222a}
.primary{background:var(--green);color:white}.primary:hover{background:#087a4f}.card{border-color:var(--line);box-shadow:0 3px 12px #003b200b}.photo{background:linear-gradient(135deg,#edf8ef,#d2eadb)}.details small{color:#168653}.chip{border-color:var(--line)}.chip.on{background:var(--green)}.panel{background:#fbfffc}.group{color:var(--deep)}.sub button{background:var(--mint);color:var(--deep)}.cartline button{background:var(--mint)}footer{background:var(--deep)}.toast{background:var(--deep)}#detail{border:1px solid var(--line)}
@media(max-width:600px){.hero-brand img{width:110px;border-radius:14px}.hero{gap:12px}.brand img{width:40px;height:40px}.brand strong{font-size:21px}.brand small{font-size:7px}.hero h1{font-size:clamp(23px,5vw,34px)}}
</style></head><body>
<header><button class="icon" id="menuBtn" type="button" aria-label="فتح القائمة">☰</button><a class="brand" href="#" id="brandHome" aria-label="BS Brand of Saudi"><img src="bs-logo.webp" alt="BS Brand of Saudi"><span><strong>BS</strong><small>BRAND OF SAUDI</small></span></a><button class="icon" id="cartBtn" type="button">🛒 السلة <span id="cartCount">0</span></button></header>
<div id="shade" class="shade"></div><aside class="panel" id="menuPanel" aria-label="الأقسام"><div class="navhead"><h2>الأقسام</h2><button class="icon" id="closeMenu" type="button">✕</button></div><button class="group" id="homeNav" type="button">🏠 الرئيسية</button><div id="navigation"></div></aside>
<aside class="panel" id="cartPanel" aria-label="سلة المشتريات"><div class="navhead"><h2>سلة المشتريات</h2><button class="icon" id="closeCart" type="button">✕</button></div><div id="cartItems"></div><h3 id="total">الإجمالي: 0 ر.س</h3><button class="primary" id="checkout" type="button">إتمام الطلب (تجريبي)</button></aside>
<section class="hero" id="hero"><div><h1>BS — BRAND OF SAUDI</h1><p>أناقة سعودية بهوية عصرية. اكتشف تشكيلتنا للرجال والنساء والأطفال.</p><button class="primary" id="shopNow" type="button">تسوّق الآن ←</button></div><div class="hero-brand"><img src="bs-logo.webp" alt="شعار BS Brand of Saudi"></div></section>
<main><section id="home"><h2>✨ المنتجات الجديدة</h2><div class="grid" id="newGrid"></div><h2>🔥 الأكثر مبيعًا</h2><div class="grid" id="bestGrid"></div></section><section id="catalog" hidden><div class="row"><h2 id="catalogTitle">جميع المنتجات</h2><button class="chip" id="backHome" type="button">الرئيسية</button></div><input id="search" placeholder="ابحث عن منتج..." aria-label="البحث عن منتج"><div id="filters"></div><div class="grid" id="catalogGrid"></div></section><section id="productPage" hidden><button class="chip" id="backCatalog" type="button">← العودة للمنتجات</button><div id="detail"></div></section></main>
<footer>BS | BRAND OF SAUDI — لا توجد عمليات دفع حقيقية</footer><div id="toast" class="toast" role="status"></div>
<script>
(function(){'use strict';document.getElementById('brandHome').addEventListener('click',function(e){e.preventDefault();document.getElementById('homeNav').click()});
const groups=['رجال','نساء','أطفال'],cats=['تيشيرت','بنطلون','جزمة','كاب أو قبعة'];const icons={'تيشيرت':'👕','بنطلون':'👖','جزمة':'👟','كاب أو قبعة':'🧢'};const base={'تيشيرت':79,'بنطلون':139,'جزمة':219,'كاب أو قبعة':49};const products=[];let id=0;groups.forEach(g=>cats.forEach(c=>['كلاسيكي','عصري','مميز'].forEach((style,i)=>products.push({id:++id,group:g,category:c,name:c+' '+g+' '+style,price:base[c]+i*20,emoji:icons[c],fresh:i>0,best:i<2}))));
const el=id=>document.getElementById(id);let cart=[],currentGroup='الكل',currentCat='الكل',lastView='home',selected=null;try{cart=JSON.parse(localStorage.getItem('bsBrandCart')||'[]');if(!Array.isArray(cart))cart=[];cart=cart.filter(x=>products.some(p=>p.id===x.id)&&Number.isInteger(x.qty)&&x.qty>0)}catch(e){cart=[]}
function persist(){try{localStorage.setItem('bsBrandCart',JSON.stringify(cart))}catch(e){}}
function toast(t){el('toast').textContent=t;el('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el('toast').style.display='none',1900)}
function hidePanels(){el('menuPanel').classList.remove('open');el('cartPanel').classList.remove('open');el('shade').classList.remove('open')}
function openPanel(id){hidePanels();el(id).classList.add('open');el('shade').classList.add('open');if(id==='cartPanel')renderCart()}
function view(name){['home','catalog','productPage'].forEach(k=>el(k).hidden=k!==name);el('hero').hidden=name!=='home';hidePanels();window.scrollTo(0,0)}
function card(p){return `<article class="card"><div class="photo" role="img" aria-label="${p.category}">${p.emoji}</div><div class="details"><small>${p.group} / ${p.category}</small><h3>${p.name}</h3><strong>${p.price} ر.س</strong><button class="primary" type="button" data-detail="${p.id}">عرض المنتج</button></div></article>`}
function renderHome(){el('newGrid').innerHTML=products.filter(p=>p.fresh).slice(0,8).map(card).join('');el('bestGrid').innerHTML=products.filter(p=>p.best).slice(0,8).map(card).join('')}
function home(){lastView='home';view('home')}
function catalog(g='الكل',c='الكل'){currentGroup=g;currentCat=c;lastView='catalog';el('search').value='';renderCatalog();view('catalog')}
function renderCatalog(){el('catalogTitle').textContent=currentGroup==='الكل'?'جميع المنتجات':currentGroup+' — '+(currentCat==='الكل'?'جميع الملابس':currentCat);const opts=currentGroup==='الكل'?['الكل',...groups]:['الكل',...cats];el('filters').innerHTML=opts.map(x=>`<button type="button" class="chip ${x===(currentGroup==='الكل'?currentGroup:currentCat)?'on':''}" data-filter="${x}">${x}</button>`).join('');const q=el('search').value.trim();const arr=products.filter(p=>(currentGroup==='الكل'||p.group===currentGroup)&&(currentCat==='الكل'||p.category===currentCat)&&(!q||p.name.includes(q)||p.category.includes(q)));el('catalogGrid').innerHTML=arr.length?arr.map(card).join(''):'<p class="muted">لا توجد منتجات مطابقة.</p>'}
function detail(id){selected=products.find(p=>p.id===id);if(!selected)return;el('detail').innerHTML=`<div class="photo">${selected.emoji}</div><small>${selected.group} / ${selected.category}</small><h2>${selected.name}</h2><h3>${selected.price} ر.س</h3><label for="size">اختر المقاس</label><select id="size">${(selected.category==='جزمة'?['36','38','40','42','44']:selected.category==='كاب أو قبعة'?['مقاس واحد']:['S','M','L','XL']).map(s=>`<option>${s}</option>`).join('')}</select><label for="qty">الكمية</label><select id="qty">${[1,2,3,4,5].map(n=>`<option value="${n}">${n}</option>`).join('')}</select><button class="primary" id="addItem" type="button">أضف إلى السلة</button>`;view('productPage')}
function addItem(){if(!selected)return;const size=el('size').value,qty=Number(el('qty').value);const old=cart.find(x=>x.id===selected.id&&x.size===size);if(old)old.qty+=qty;else cart.push({id:selected.id,size,qty});persist();updateCount();toast('تمت الإضافة للسلة ✓')}
function updateCount(){el('cartCount').textContent=cart.reduce((s,x)=>s+x.qty,0)}
function renderCart(){if(!cart.length){el('cartItems').innerHTML='<p class="muted">السلة فارغة حاليًا.</p>'}else{el('cartItems').innerHTML=cart.map((x,i)=>{const p=products.find(p=>p.id===x.id);return `<div class="cartline"><strong>${p.name}</strong><p>المقاس: ${x.size} | الكمية: ${x.qty}</p><p>${p.price*x.qty} ر.س</p><button type="button" data-remove="${i}">حذف</button></div>`}).join('')}el('total').textContent='الإجمالي: '+cart.reduce((s,x)=>s+products.find(p=>p.id===x.id).price*x.qty,0)+' ر.س';updateCount()}
function renderNav(){el('navigation').innerHTML=groups.map((g,i)=>`<div><button class="group" type="button" data-group="${i}" aria-expanded="false">${g} ⌄</button><div class="sub" id="sub${i}"><button type="button" data-category="${g}|الكل">جميع ${g}</button>${cats.map(c=>`<button type="button" data-category="${g}|${c}">${c}</button>`).join('')}</div></div>`).join('')}
el('menuBtn').addEventListener('click',()=>openPanel('menuPanel'));el('cartBtn').addEventListener('click',()=>openPanel('cartPanel'));el('closeMenu').addEventListener('click',hidePanels);el('closeCart').addEventListener('click',hidePanels);el('shade').addEventListener('click',hidePanels);el('homeNav').addEventListener('click',home);el('shopNow').addEventListener('click',()=>catalog());el('backHome').addEventListener('click',home);el('backCatalog').addEventListener('click',()=>lastView==='home'?home():catalog(currentGroup,currentCat));el('search').addEventListener('input',renderCatalog);
el('navigation').addEventListener('click',e=>{const group=e.target.closest('[data-group]');if(group){const i=group.dataset.group;const sub=el('sub'+i);const isOpen=sub.classList.toggle('open');group.setAttribute('aria-expanded',String(isOpen));return}const cat=e.target.closest('[data-category]');if(cat){const [g,c]=cat.dataset.category.split('|');catalog(g,c)}});
el('filters').addEventListener('click',e=>{const btn=e.target.closest('[data-filter]');if(!btn)return;const x=btn.dataset.filter;if(currentGroup==='الكل')catalog(x,'الكل');else catalog(currentGroup,x)});
document.addEventListener('click',e=>{const btn=e.target.closest('[data-detail]');if(btn)detail(Number(btn.dataset.detail));if(e.target.id==='addItem')addItem();const rm=e.target.closest('[data-remove]');if(rm){cart.splice(Number(rm.dataset.remove),1);persist();renderCart()}});
el('checkout').addEventListener('click',()=>{if(!cart.length){toast('السلة فارغة');return}cart=[];persist();renderCart();hidePanels();toast('تم تسجيل طلب تجريبي بنجاح ✓')});document.addEventListener('keydown',e=>{if(e.key==='Escape')hidePanels()});renderNav();renderHome();updateCount();
})();
</script></body></html>
